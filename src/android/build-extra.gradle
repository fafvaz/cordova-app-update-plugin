android {
    compileSdkVersion 33
    defaultConfig {
        targetSdkVersion 33
    }
}

allprojects {
    repositories {
        maven {
            url "https://maven.google.com"
        }
        google()
        mavenCentral()
    }
}

dependencies {
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.material:material:1.9.0'
}
